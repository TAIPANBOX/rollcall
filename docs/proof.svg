<text x="512" y="262" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">128 cases</text>
<rect x="725" y="108" width="203" height="200" rx="12" fill="#141a23" stroke="#4493f8" filter="url(#soft)"/>
