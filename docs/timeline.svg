<text x="72" y="561" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">the chat</text>
<text x="72" y="579" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">verbatim</text>
<circle cx="56" cy="631" r="6" fill="#141a23" stroke="#ff6b63" stroke-width="2.5"/>
<text x="72" y="636" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">the router records the absence</text>
<path d="M404 624 L411 631 L404 638 L397 631 Z" fill="#141a23" stroke="#e3b341" stroke-width="2.5"/>
<text x="420" y="636" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">flint2's shutdown announcement arrives</text>
<text x="48" y="662" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">flint2 is the only sender: it sent the first line before its own reboot, and told about that reboot once it was back. Back times are the start plus the length in the line.</text>
<text x="48" y="684" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">In the first lab run that day, an internet cut on flint2 from 18:07 to 18:10 gave one line with the start, the end and the length, once it was back.</text>
