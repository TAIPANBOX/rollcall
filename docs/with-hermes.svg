<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="668" viewBox="0 0 1280 668" role="img" aria-label="One Flint 2 runs both services side by side. Hermes Agent with openwrt-mcp, an AI agent you ask to look at or change the router: 238 MB resident in 6 processes, 207 MiB installed, 45 MB of data on a USB stick. rollcall, which tells you without being asked when a router of the site goes down: 15.5 MB resident, 11 MiB installed. Each has its own Telegram bot.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  
</defs>

<rect width="1280" height="668" fill="url(#bg)"/><rect width="1280" height="668" fill="url(#grid)" opacity="0.5"/><rect width="1280" height="4" fill="url(#accent)"/>
<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="600" fill="#e6edf3">Next to hermes-openwrt, on one Flint 2</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#69788b">flint2, GL.iNet GL-MT6000, 986 MB RAM, OpenWrt 25.12.5. Both ran side by side through two reboots, 2026-10-23.</text>
