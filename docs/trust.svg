<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Who may change the group. The roster is signed by the primary admin; a backup admin may sign too and takes over after 10 minutes of silence from the primary; the recovery code, kept offline, overrides both. A takeover is provisional: a confirmation by the backup holds only after 24 hours without the primary; the recovery code confirms at once.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b63"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
  <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69788b"/></marker>
  <marker id="ar-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
  <marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker>
  <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  <marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#283341"/></marker>
</defs>

<rect width="960" height="580" fill="url(#bg)"/><rect width="960" height="580" fill="url(#grid)" opacity="0.5"/><rect width="960" height="4" fill="url(#accent)"/>
<text x="32" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Who may change the group</text>
<text x="32" y="74" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#69788b">One signed roster, two admin routers, one recovery code on paper.</text>
<rect x="32" y="100" width="280" height="112" rx="12" fill="#141a23" stroke="#2dd4bf" filter="url(#soft)"/>
<g transform="translate(50,120) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#2dd4bf"/><circle cx="24" cy="26" r="3" fill="#2dd4bf" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="128" y="144" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">primary admin</text>
<text x="50" y="194" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#2dd4bf">signs the roster</text>
<line x1="172" y1="216" x2="390" y2="262" stroke="#69788b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar-gray)"/>
<rect x="340" y="100" width="280" height="112" rx="12" fill="#141a23" stroke="#4493f8" filter="url(#soft)"/>
<g transform="translate(358,120) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#4493f8" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#4493f8"/><circle cx="24" cy="26" r="3" fill="#4493f8" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="436" y="144" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">backup admin</text>
<text x="358" y="194" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#4493f8">may sign; takes over</text>
<line x1="480" y1="216" x2="480" y2="262" stroke="#69788b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar-gray)"/>
<rect x="648" y="100" width="280" height="112" rx="12" fill="#141a23" stroke="#e3b341" filter="url(#soft)"/>
<g transform="translate(674,118)" fill="none" stroke="#e3b341" stroke-width="2" stroke-linejoin="round"><path d="M0 0h30l12 12v36H0z"/><path d="M30 0v12h12"/><path d="M8 22h26M8 30h26M8 38h18" stroke-linecap="round"/></g>
<text x="744" y="144" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">recovery code</text>
<text x="666" y="194" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e3b341">on paper, offline; overrides both</text>
<line x1="788" y1="216" x2="570" y2="262" stroke="#69788b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar-gray)"/>
<rect x="220" y="266" width="520" height="82" rx="12" fill="#18142a" stroke="#a371f7" filter="url(#soft)"/>
<text x="480" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">the roster: members, roles, admins, recovery key</text>
<text x="480" y="326" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8" text-anchor="middle">each version signed and chained to the one before</text>
<text x="32" y="390" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">When the primary is gone</text>
<rect x="32" y="404" width="190" height="48" rx="12" fill="#11161e" stroke="#ff6b63"/>
<text x="127" y="434" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#ff6b63" text-anchor="middle">primary silent</text>
<rect x="328" y="404" width="232" height="48" rx="12" fill="#11161e" stroke="#4493f8"/>
<text x="444" y="434" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#4493f8" text-anchor="middle">backup takes over</text>
<rect x="664" y="404" width="232" height="48" rx="12" fill="#11161e" stroke="#3fb950"/>
<text x="780" y="434" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#3fb950" text-anchor="middle">confirmation holds</text>
<line x1="228" y1="428" x2="322" y2="428" stroke="#4493f8" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="275" y="420" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#4493f8" text-anchor="middle">10 min</text>
<line x1="566" y1="428" x2="658" y2="428" stroke="#3fb950" stroke-width="2" marker-end="url(#ar-green)"/>
<text x="612" y="420" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#3fb950" text-anchor="middle">24 h</text>
<text x="328" y="476" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">provisional, told in the chat</text>
<text x="664" y="476" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">only after a day without</text>
<text x="664" y="496" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">the primary, on each router</text>
<circle cx="38" cy="531" r="4" fill="#2dd4bf"/>
<text x="50" y="536" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">primary back within the day: it restores itself</text>
<circle cx="38" cy="555" r="4" fill="#e3b341"/>
<text x="50" y="560" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">recovery code: confirms at once, or appoints new admins</text>
</svg>
