<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Three routers exchange heartbeats over the LAN. One goes silent and comes back; the router that holds the sender role tells the Telegram chat in one line.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
</defs>
<style>
  /* one cycle is 12 s: heartbeats, beryl2 goes silent at 4 s, back at 7.5 s, one line to the chat at 9 s */
  .hb{opacity:0}
  .h1{animation:h1 2.4s linear infinite}.h1r{animation:h1r 2.4s linear 1.2s infinite}
  .h2{animation:h2 2.4s linear .4s infinite}.h2r{animation:h2r 2.4s linear 1.6s infinite}
  .h3{animation:h3 2.4s linear .8s infinite}.h3r{animation:h3r 2.4s linear 2s infinite}
  @keyframes h1{0%{opacity:0;transform:translate(0,0)}8%,90%{opacity:1}100%{opacity:0;transform:translate(0px,206px)}}
  @keyframes h1r{0%{opacity:0;transform:translate(0,0)}8%,90%{opacity:1}100%{opacity:0;transform:translate(0px,-206px)}}
  @keyframes h2{0%{opacity:0;transform:translate(0,0)}8%,90%{opacity:1}100%{opacity:0;transform:translate(150px,110px)}}
  @keyframes h2r{0%{opacity:0;transform:translate(0,0)}8%,90%{opacity:1}100%{opacity:0;transform:translate(-150px,-110px)}}
  @keyframes h3{0%{opacity:0;transform:translate(0,0)}8%,90%{opacity:1}100%{opacity:0;transform:translate(150px,-115px)}}
  @keyframes h3r{0%{opacity:0;transform:translate(0,0)}8%,90%{opacity:1}100%{opacity:0;transform:translate(-150px,115px)}}
  .to2{animation:to2 12s linear infinite}
  @keyframes to2{0%,33%{opacity:1}34%,61%{opacity:0}62%,100%{opacity:1}}
  .b2{animation:dark 12s ease-in-out infinite}
  @keyframes dark{0%,33%{opacity:1}36%,60%{opacity:.25}63%,100%{opacity:1}}
  .lk2{animation:lk 12s ease-in-out infinite}
  @keyframes lk{0%,33%{stroke:#283341}36%,60%{stroke:#ff6b63;stroke-opacity:.45}63%,100%{stroke:#283341}}
  .silent{opacity:0;animation:silent 12s ease-in-out infinite}
  @keyframes silent{0%,39%{opacity:0}41%,59%{opacity:1}61%,100%{opacity:0}}
  .back{opacity:0;animation:back 12s ease-in-out infinite}
  @keyframes back{0%,61%{opacity:0}63%,95%{opacity:1}97%,100%{opacity:0}}
  .msg{opacity:0;animation:msg 12s ease-in-out infinite}
  @keyframes msg{0%,66%{opacity:0;transform:translate(0,0)}67%{opacity:1;transform:translate(0,0)}73%{opacity:1;transform:translate(490px,80px)}74%,100%{opacity:0;transform:translate(490px,80px)}}
  .bubble{opacity:0;animation:bubble 12s ease-in-out infinite}
  @keyframes bubble{0%,73%{opacity:0}75%,96%{opacity:1}99%,100%{opacity:0}}
  .empty{opacity:1;animation:empty 12s ease-in-out infinite}
  @keyframes empty{0%,72%{opacity:1}74%,97%{opacity:0}99%,100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .hb,.h1,.h1r,.h2,.h2r,.h3,.h3r,.to2,.b2,.lk2,.silent,.back,.msg,.bubble,.empty{animation:none}
    .hb,.silent,.back,.msg,.empty{opacity:0}
    .bubble{opacity:1}
  }
</style>

<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>

<text x="60" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" letter-spacing="0.8" fill="#69788b">ONE SITE, ONE LAN</text>

<!-- heartbeat links -->
<line x1="175" y1="194" x2="175" y2="400" stroke="#283341" stroke-width="2"/>
<line class="lk2" x1="290" y1="170" x2="440" y2="280" stroke="#283341" stroke-width="2"/>
<line class="lk2" x1="290" y1="430" x2="440" y2="315" stroke="#283341" stroke-width="2"/>
<text x="190" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#69788b">UDP 7432</text>
<text x="190" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#69788b">every 5 s</text>

<!-- heartbeat dots, each one a signed and encrypted packet -->
<circle class="hb h1" cx="175" cy="194" r="5" fill="#2dd4bf"/>
<circle class="hb h1r" cx="175" cy="400" r="5" fill="#2dd4bf"/>
<g class="to2">
  <circle class="hb h2" cx="290" cy="170" r="5" fill="#2dd4bf"/>
  <circle class="hb h2r" cx="440" cy="280" r="5" fill="#2dd4bf"/>
  <circle class="hb h3" cx="290" cy="430" r="5" fill="#2dd4bf"/>
  <circle class="hb h3r" cx="440" cy="315" r="5" fill="#2dd4bf"/>
</g>

<!-- flint2: primary admin and sender -->
<g filter="url(#soft)"><rect x="60" y="90" width="230" height="104" rx="10" fill="#1b2331" stroke="#283341"/></g>
<rect x="60" y="90" width="6" height="104" rx="3" fill="#2dd4bf"/>
<text x="82" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" fill="#e6edf3">flint2</text>
<circle cx="262" cy="116" r="6" fill="#3fb950"/>
<text x="82" y="144" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">Flint 2</text>
<rect x="82" y="158" width="74" height="22" rx="11" fill="#141a23" stroke="#2dd4bf"/>
<text x="119" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">primary</text>
<rect x="164" y="158" width="66" height="22" rx="11" fill="#141a23" stroke="#4493f8"/>
<text x="197" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4493f8" text-anchor="middle">sender</text>

<!-- beryl1: backup admin -->
<g filter="url(#soft)"><rect x="60" y="400" width="230" height="104" rx="10" fill="#1b2331" stroke="#283341"/></g>
<rect x="60" y="400" width="6" height="104" rx="3" fill="#2dd4bf"/>
<text x="82" y="432" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" fill="#e6edf3">beryl1</text>
<circle cx="262" cy="426" r="6" fill="#3fb950"/>
<text x="82" y="454" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">Beryl AX</text>
<rect x="82" y="468" width="66" height="22" rx="11" fill="#141a23" stroke="#2dd4bf"/>
<text x="115" y="483" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">backup</text>

<!-- beryl2: an ordinary member; this one goes silent -->
<g class="b2">
  <g filter="url(#soft)"><rect x="440" y="245" width="230" height="104" rx="10" fill="#1b2331" stroke="#283341"/></g>
  <rect x="440" y="245" width="6" height="104" rx="3" fill="#2dd4bf"/>
  <text x="462" y="277" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" fill="#e6edf3">beryl2</text>
  <circle cx="642" cy="271" r="6" fill="#3fb950"/>
  <text x="462" y="299" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">Beryl AX</text>
  <rect x="462" y="313" width="66" height="22" rx="11" fill="#141a23" stroke="#69788b"/>
  <text x="495" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#9aa7b8" text-anchor="middle">member</text>
</g>
<text class="silent" x="555" y="378" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#ff6b63" text-anchor="middle">silent: no heartbeat for 30 s</text>
<text class="back" x="555" y="378" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#3fb950" text-anchor="middle">back, with a new boot ID</text>

<!-- flint2 to Telegram -->
<line x1="290" y1="120" x2="776" y2="199" stroke="#4493f8" stroke-width="2" stroke-dasharray="6 5" opacity="0.6" marker-end="url(#arrow)"/>
<text x="540" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4493f8" text-anchor="middle">HTTPS, api.telegram.org</text>
<circle class="msg" cx="290" cy="120" r="6" fill="#4493f8"/>

<!-- the chat -->
<g filter="url(#soft)"><rect x="780" y="120" width="450" height="270" rx="14" fill="#0e1621" stroke="#283341"/></g>
<rect x="780" y="120" width="450" height="62" rx="14" fill="#17212b"/>
<rect x="780" y="160" width="450" height="22" fill="#17212b"/>
<circle cx="818" cy="151" r="18" fill="#5288c1"/>
<text x="818" y="157" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">R</text>
<text x="848" y="147" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">your bot</text>
<text x="848" y="166" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#6d8296">Telegram, private chat</text>

<text class="empty" x="1005" y="290" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b" text-anchor="middle">nothing while all is well</text>

<g class="bubble">
  <rect x="798" y="214" width="414" height="96" rx="14" fill="#182533"/>
  <text x="814" y="240" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3">home: beryl2 rebooted unexpectedly at 18:11,</text>
  <text x="814" y="262" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3">back after 44 s, confirmed by 0 of 2.</text>
  <text x="814" y="284" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3">Times are approximate.</text>
  <text x="798" y="334" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf">one message for the whole incident</text>
  <text x="798" y="354" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">as recorded in the lab run, 2026-10-23</text>
</g>

<!-- bottom strip -->
<line x1="60" y1="560" x2="1220" y2="560" stroke="#222b38" stroke-width="1"/>
<text x="640" y="592" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8" text-anchor="middle">Heartbeats every 5 s over the LAN. One message per incident, sent by a router that can still reach Telegram.</text>
<text x="1252" y="626" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#69788b" text-anchor="end">github.com/TAIPANBOX/rollcall</text>
</svg>
