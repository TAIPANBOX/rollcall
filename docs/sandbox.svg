<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="The sandbox: rollcalld runs in a ujail jail with a read-only root, as its own user with no effective capabilities, with no_new_privs and its own seccomp filter on every thread. It never reads the root-only network and system files: root writes a snapshot of the few facts it needs.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b63"/></marker>
</defs>
<rect width="1280" height="600" fill="url(#bg)"/><rect width="1280" height="600" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>
<style>
  @keyframes flow{to{stroke-dashoffset:-24}}.flow{stroke-dasharray:8 4;animation:flow 1.2s linear infinite}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}.pulse{animation:pulse 3s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style>
<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#e6edf3" font-weight="600">What the daemon can touch</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">Read from /proc on each of the three lab routers, 2026-10-23, OpenWrt 25.12.5 on aarch64.</text>

<!-- the layers, outermost first -->
<rect x="48" y="116" width="600" height="404" rx="12" fill="#0f1520" stroke="#30363d"/>
<text x="68" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3" font-weight="600">ujail jail, read-only root</text>
<text x="628" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#69788b" text-anchor="end">dev etc proc sys tmp usr var</text>

<rect x="72" y="156" width="552" height="344" rx="10" fill="#111824" stroke="#30363d"/>
<text x="92" y="182" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3" font-weight="600">user rollcall, uid 1660</text>
<text x="604" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#69788b" text-anchor="end">CapEff 0</text>

<rect x="96" y="196" width="504" height="284" rx="10" fill="#131b28" stroke="#30363d"/>
<text x="116" y="222" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3" font-weight="600">no_new_privs</text>
<text x="580" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#69788b" text-anchor="end">NoNewPrivs 1</text>

<rect x="120" y="236" width="456" height="224" rx="10" fill="#151e2c" stroke="#2dd4bf" stroke-opacity="0.6"/>
<text x="140" y="262" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#2dd4bf" font-weight="600">its own seccomp filter, every thread</text>
<text x="556" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#69788b" text-anchor="end">Seccomp 2</text>

<rect class="pulse" x="144" y="278" width="408" height="162" rx="10" fill="#1b2331" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="166" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e6edf3">rollcalld</text>
<text x="166" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">74 system calls allowed (arm64)</text>
<text x="166" y="362" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">any other one: SIGSYS, process ends</text>
<text x="166" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">no execve, no shell, no ubus</text>
<text x="166" y="406" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">listens on br-lan only</text>
<text x="166" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#3fb950">SO_BINDTODEVICE applied: true</text>

<!-- root-only files: never read -->
<rect x="716" y="116" width="516" height="112" rx="10" fill="#0f1520" stroke="#30363d"/>
<rect x="716" y="116" width="4" height="112" rx="2" fill="#ff6b63"/>
<text x="738" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#e6edf3">/etc/config/network, system</text>
<text x="738" y="174" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">mode 0600 root on 25.12; they can hold PPPoE passwords</text>
<text x="738" y="194" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">and WireGuard private keys</text>
<text x="738" y="216" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#ff6b63">not in the jail, never opened by the daemon</text>

<path class="flow" d="M974,232 L974,262" stroke="#4493f8" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

<rect x="716" y="268" width="516" height="84" rx="10" fill="#0f1520" stroke="#30363d"/>
<rect x="716" y="268" width="4" height="84" rx="2" fill="#4493f8"/>
<text x="738" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#e6edf3">rollcall snapshot, as root</text>
<text x="738" y="324" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">run by the init script before every start,</text>
<text x="738" y="342" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">and by hotplug on every interface event</text>

<path class="flow" d="M974,356 L974,386" stroke="#4493f8" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

<rect x="716" y="392" width="516" height="128" rx="10" fill="#0f1520" stroke="#30363d"/>
<rect x="716" y="392" width="4" height="128" rx="2" fill="#3fb950"/>
<text x="738" y="422" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#e6edf3">/var/run/rollcall/snapshot.json</text>
<text x="738" y="448" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">root:rollcall 0640: the zones, their devices,</text>
<text x="738" y="468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">which zones face the internet, the time zone</text>
<text x="738" y="494" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#3fb950">no password, no key; stale or missing: no start</text>

<!-- the daemon and the two sources -->
<line x1="556" y1="300" x2="708" y2="176" stroke="#ff6b63" stroke-width="2" stroke-dasharray="7 5" opacity="0.7" marker-end="url(#arrowR)"/>
<g stroke="#ff6b63" stroke-width="3.5" stroke-linecap="round">
  <line x1="620" y1="230" x2="640" y2="250"/><line x1="640" y1="230" x2="620" y2="250"/>
</g>
<line x1="708" y1="456" x2="560" y2="410" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
<text x="690" y="420" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#3fb950" text-anchor="end">reads</text>

<line x1="48" y1="548" x2="1232" y2="548" stroke="#222b38" stroke-width="1"/>
<text x="48" y="578" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">The filter goes on before the daemon opens any file or socket. Without it, or without no_new_privs, the daemon does not listen.</text>
</svg>
