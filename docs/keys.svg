<svg xmlns="http://www.w3.org/2000/svg" width="960" height="482" viewBox="0 0 960 482" role="img" aria-label="The group key is bound to the roster. Under roster version 7 every member holds key K7. The admin removes ap-garden: roster version 8 and a new key K8, bound to it, sealed to each remaining member. ap-garden still holds K7, which no longer fits; after a 60 s overlap its packets are dropped. Keys also rotate every 30 days.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b63"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
  <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69788b"/></marker>
  <marker id="ar-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
  <marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker>
  <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  <marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#283341"/></marker>
</defs>

<rect width="960" height="482" fill="url(#bg)"/><rect width="960" height="482" fill="url(#grid)" opacity="0.5"/><rect width="960" height="4" fill="url(#accent)"/>
<text x="32" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">The group key belongs to one roster</text>
<text x="32" y="74" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#69788b">A removed router keeps an old key that no longer fits.</text>
<rect x="32" y="100" width="420" height="270" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="52" y="132" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">roster v7</text>
<rect x="52" y="150" width="380" height="40" rx="10" fill="#18142a" stroke="#a371f7"/>
<g transform="translate(66,158)" fill="none" stroke="#a371f7" stroke-width="2"><circle cx="8" cy="12" r="6"/><path d="M14 12h16M24 12v6M29 12v4"/></g>
<text x="108" y="176" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#a371f7">key K7, bound to v7</text>
<g transform="translate(54,218) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#2dd4bf"/><circle cx="24" cy="26" r="3" fill="#2dd4bf" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="84" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">gateway</text>
<text x="84" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#2dd4bf" text-anchor="middle">holds it</text>
<g transform="translate(186,218) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#2dd4bf"/><circle cx="24" cy="26" r="3" fill="#2dd4bf" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="216" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">ap-office</text>
<text x="216" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#2dd4bf" text-anchor="middle">holds it</text>
<g transform="translate(318,218) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#2dd4bf"/><circle cx="24" cy="26" r="3" fill="#2dd4bf" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="348" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">ap-garden</text>
<text x="348" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#2dd4bf" text-anchor="middle">holds it</text>
<text x="52" y="350" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">sealed to each member's own key, signed by the admin</text>
<rect x="508" y="100" width="420" height="270" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="528" y="132" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">roster v8: ap-garden removed</text>
<rect x="528" y="150" width="380" height="40" rx="10" fill="#18142a" stroke="#a371f7"/>
<g transform="translate(542,158)" fill="none" stroke="#a371f7" stroke-width="2"><circle cx="8" cy="12" r="6"/><path d="M14 12h16M24 12v6M29 12v4"/></g>
<text x="584" y="176" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#a371f7">key K8, bound to v8</text>
<g transform="translate(530,218) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#2dd4bf"/><circle cx="24" cy="26" r="3" fill="#2dd4bf" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="560" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">gateway</text>
<text x="560" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#2dd4bf" text-anchor="middle">holds it</text>
<g transform="translate(662,218) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#2dd4bf"/><circle cx="24" cy="26" r="3" fill="#2dd4bf" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="692" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">ap-office</text>
<text x="692" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#2dd4bf" text-anchor="middle">holds it</text>
<g transform="translate(794,218) scale(1)" opacity="0.35"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#ff6b63" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#ff6b63"/><circle cx="24" cy="26" r="3" fill="#ff6b63" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="824" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#ff6b63" text-anchor="middle">ap-garden</text>
<text x="824" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ff6b63" text-anchor="middle">only K7</text>
<text x="824" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#ff6b63" text-anchor="middle">does not fit</text>
<text x="528" y="350" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">sealed to each member's own key, signed by the admin</text>
<line x1="458" y1="235" x2="502" y2="235" stroke="#e3b341" stroke-width="2.5" marker-end="url(#ar-amber)"/>
<text x="480" y="223" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#e3b341" text-anchor="middle">remove</text>
<text x="32" y="408" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#a371f7">bound</text>
<text x="120" y="408" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">to the roster's version and hash, inside what the admin signs</text>
<text x="32" y="432" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#a371f7">rotates</text>
<text x="120" y="432" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">on every removal, on rollcall rotate, and every 30 days</text>
<text x="32" y="456" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#a371f7">overlap</text>
<text x="120" y="456" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">the previous key is still accepted for 60 s during a switch</text>
</svg>
