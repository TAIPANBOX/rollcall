<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img" aria-label="What kind of incident it was. A silent router answers again. Same boot ID: it lost its link and stayed up. Otherwise, a changed OpenWrt version: upgraded, old to new. Otherwise, announced going down: rebooted as planned. Otherwise: rebooted unexpectedly, a crash or a power cut.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b63"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
  <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69788b"/></marker>
  <marker id="ar-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
  <marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker>
  <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  <marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#283341"/></marker>
</defs>

<rect width="960" height="494" fill="url(#bg)"/><rect width="960" height="494" fill="url(#grid)" opacity="0.5"/><rect width="960" height="4" fill="url(#accent)"/>
<text x="32" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">What kind of incident it was</text>
<text x="32" y="74" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#69788b">The others compare the router's new heartbeat with its last one before the silence.</text>
<rect x="32" y="100" width="330" height="50" rx="12" fill="#141a23" stroke="#69788b"/>
<text x="50" y="131" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">A silent router answers again</text>
<rect x="32" y="172" width="330" height="50" rx="12" fill="#141a23" stroke="#9aa7b8"/>
<text x="50" y="203" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">Same boot ID?</text>
<circle cx="336" cy="197.0" r="12" fill="#0f1520" stroke="#9aa7b8"/>
<text x="336" y="202" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#9aa7b8" text-anchor="middle">?</text>
<rect x="452" y="172" width="476" height="50" rx="12" fill="#11161e" stroke="#2dd4bf"/>
<text x="470" y="194" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Lost its link, stayed up</text>
<text x="470" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#2dd4bf">same boot: it never rebooted</text>
<line x1="368" y1="197" x2="446" y2="197" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="407" y="189" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="middle">yes</text>
<line x1="92" y1="152" x2="92" y2="168" stroke="#69788b" stroke-width="2" marker-end="url(#ar-gray)"/>
<rect x="32" y="244" width="330" height="50" rx="12" fill="#141a23" stroke="#9aa7b8"/>
<text x="50" y="275" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">OpenWrt version changed?</text>
<circle cx="336" cy="269.0" r="12" fill="#0f1520" stroke="#9aa7b8"/>
<text x="336" y="274" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#9aa7b8" text-anchor="middle">?</text>
<rect x="452" y="244" width="476" height="50" rx="12" fill="#11161e" stroke="#4493f8"/>
<text x="470" y="266" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Upgraded, old -&gt; new</text>
<text x="470" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#4493f8">both versions named in the line</text>
<line x1="368" y1="269" x2="446" y2="269" stroke="#4493f8" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="407" y="261" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#4493f8" text-anchor="middle">yes</text>
<line x1="92" y1="224" x2="92" y2="240" stroke="#69788b" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="106" y="238" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#69788b">no</text>
<rect x="32" y="316" width="330" height="50" rx="12" fill="#141a23" stroke="#9aa7b8"/>
<text x="50" y="347" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">Announced going down?</text>
<circle cx="336" cy="341.0" r="12" fill="#0f1520" stroke="#9aa7b8"/>
<text x="336" y="346" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#9aa7b8" text-anchor="middle">?</text>
<rect x="452" y="316" width="476" height="50" rx="12" fill="#11161e" stroke="#e3b341"/>
<text x="470" y="338" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Rebooted as planned</text>
<text x="470" y="357" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e3b341">flint2 at 20:54, back after 45 s</text>
<line x1="368" y1="341" x2="446" y2="341" stroke="#e3b341" stroke-width="2" marker-end="url(#ar-amber)"/>
<text x="407" y="333" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#e3b341" text-anchor="middle">yes</text>
<line x1="92" y1="296" x2="92" y2="312" stroke="#69788b" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="106" y="310" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#69788b">no</text>
<line x1="92" y1="368" x2="92" y2="384" stroke="#69788b" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="106" y="382" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#69788b">no</text>
<rect x="32" y="388" width="896" height="50" rx="12" fill="#11161e" stroke="#ff6b63"/>
<text x="50" y="410" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Rebooted unexpectedly: a crash or a power cut</text>
<text x="50" y="429" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#ff6b63">beryl2 at 20:52, back after 39 s</text>
<text x="32" y="476" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">A boot ID is random per boot, so it decides whether the router rebooted; nothing overrides it.</text>
</svg>
