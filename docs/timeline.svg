<text x="730" y="561" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">home: flint2 rebooted as planned at 20:54,</text>
<text x="730" y="583" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">back after 45 s, confirmed by 2 of 2.</text>
