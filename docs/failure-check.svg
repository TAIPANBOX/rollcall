<line class="flow" x1="116" y1="266" x2="210" y2="332" stroke="#4493f8" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="128" y="205" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#4493f8" text-anchor="middle">hear it?</text>
<line x1="278" y1="178" x2="364" y2="262" stroke="#ff6b63" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="278" y1="344" x2="364" y2="262" stroke="#ff6b63" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="330" y="196" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#ff6b63" text-anchor="middle">no</text>
<text x="352" y="334" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#ff6b63" text-anchor="middle">no</text>
<rect x="52" y="420" width="200" height="10" rx="3" fill="#2dd4bf" opacity="0.5"/><rect x="252" y="420" width="200" height="10" rx="3" fill="#e3b341" opacity="0.7"/><circle cx="452" cy="425" r="7" fill="#ff6b63"/>
<text x="52" y="454" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">0 s</text>
<text x="252" y="454" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#e3b341" text-anchor="middle">15 s: ask</text>
<text x="452" y="454" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#ff6b63" text-anchor="end">30 s: silent</text>
<text x="352" y="412" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b" text-anchor="middle">asks again at 20 and 25 s</text>
<rect x="488" y="96" width="440" height="380" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="508" y="126" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">A router lost its own link</text>
<g transform="translate(526,236) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#e3b341" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#e3b341"/><circle cx="24" cy="26" r="3" fill="#e3b341" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="556" y="294" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e3b341" text-anchor="middle">cut off</text>
