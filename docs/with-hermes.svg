<text x="284" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="600" fill="#e6edf3">flint2</text>
<text x="284" y="172" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#9aa7b8">One router, two services. They do different jobs, and each has its own Telegram bot.</text>
<text x="284" y="198" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#69788b">Bars to scale: memory as a share of the router's 986 MB, installed size on one scale for both.</text>
<rect x="48" y="232" width="584" height="366" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<rect x="48" y="232" width="6" height="366" rx="3" fill="#4493f8"/>
<text x="76" y="274" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Hermes Agent</text>
<rect x="468" y="252" width="136" height="30" rx="15" fill="#0f1520" stroke="#4493f8"/>
<text x="536" y="274" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#4493f8" text-anchor="middle">you ask it</text>
<text x="76" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#69788b">hermes-agent and openwrt-mcp</text>
<text x="76" y="336" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#e6edf3">An AI agent you ask to look at</text>
<text x="76" y="362" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#e6edf3">or change the router.</text>
<text x="76" y="406" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#69788b">memory, resident</text>
<text x="612" y="406" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="end">238 MB, 6 processes</text>
<rect x="76" y="418" width="536" height="14" rx="7" fill="#1f2834"/>
<rect x="76" y="418" width="129.4" height="14" rx="4" fill="#4493f8"/>
<text x="76" y="468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#69788b">installed</text>
<text x="612" y="468" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="end">207 MiB</text>
<rect x="76" y="480" width="536" height="14" rx="7" fill="#1f2834"/>
<rect x="76" y="480" width="536.0" height="14" rx="4" fill="#4493f8"/>
<text x="76" y="530" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#69788b">data</text>
<text x="612" y="530" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#e6edf3" text-anchor="end">45 MB on a USB stick</text>
<line x1="76" y1="548" x2="612" y2="548" stroke="#1f2834"/>
<text x="76" y="576" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#4493f8">github.com/TAIPANBOX/hermes-openwrt</text>
<rect x="648" y="232" width="584" height="366" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<rect x="648" y="232" width="6" height="366" rx="3" fill="#2dd4bf"/>
<text x="676" y="274" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600" fill="#e6edf3">rollcall</text>
<rect x="1068" y="252" width="136" height="30" rx="15" fill="#0f1520" stroke="#2dd4bf"/>
<text x="1136" y="274" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#2dd4bf" text-anchor="middle">it tells you</text>
<text x="676" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#69788b">rollcalld, one process, 11 threads</text>
<text x="676" y="336" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#e6edf3">Tells you, without being asked, when a router of the site</text>
<text x="676" y="362" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#e6edf3">goes down, reboots, upgrades or loses the internet.</text>
<text x="676" y="406" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#69788b">memory, resident</text>
<text x="1212" y="406" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="end">15.5 MB, 1 process</text>
<rect x="676" y="418" width="536" height="14" rx="7" fill="#1f2834"/>
<rect x="676" y="418" width="8.4" height="14" rx="4" fill="#2dd4bf"/>
<text x="676" y="468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#69788b">installed</text>
<text x="1212" y="468" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="end">11 MiB</text>
<rect x="676" y="480" width="536" height="14" rx="7" fill="#1f2834"/>
<rect x="676" y="480" width="28.5" height="14" rx="4" fill="#2dd4bf"/>
<text x="676" y="530" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#69788b">group state</text>
<text x="1212" y="530" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#e6edf3" text-anchor="end">65 KB on flash</text>
<line x1="676" y1="548" x2="1212" y2="548" stroke="#1f2834"/>
<text x="676" y="576" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#2dd4bf">github.com/TAIPANBOX/rollcall</text>
<text x="48" y="640" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#69788b">Both measured on flint2 on 2026-10-23. Two separate packages: neither depends on the other.</text>
</svg>
