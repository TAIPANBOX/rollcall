<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" role="img" aria-label="When nobody can reach Telegram. The internet on flint2, the only sender, was cut from 18:07 to 18:10. The incident waited in the queue, which survives a restart; once the internet was back, one line went out with the start, the end and the length.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b63"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
  <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69788b"/></marker>
  <marker id="ar-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
  <marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker>
  <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  <marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#283341"/></marker>
</defs>
<style>
  .flow{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect width="960" height="454" fill="url(#bg)"/><rect width="960" height="454" fill="url(#grid)" opacity="0.5"/><rect width="960" height="4" fill="url(#accent)"/>
<text x="32" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">When nobody could reach Telegram</text>
<text x="32" y="74" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#69788b">First lab run, 2026-10-23: the internet cut on flint2, the only sender.</text>
<line x1="120" y1="164" x2="239.7" y2="164" stroke="#2dd4bf" stroke-width="4"/><line x1="617.7" y1="164" x2="876" y2="164" stroke="#2dd4bf" stroke-width="4"/>
<rect x="239.7" y="150" width="378.0" height="28" rx="6" fill="#ff6b63" fill-opacity="0.22" stroke="#ff6b63"/>
<text x="428.7" y="170" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#ff8a84" text-anchor="middle">internet down on flint2</text>
<line x1="120.0" y1="184" x2="120.0" y2="192" stroke="#46546a" stroke-width="1.5"/>
<text x="120" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#69788b" text-anchor="middle">18:06</text>
<line x1="246.0" y1="184" x2="246.0" y2="192" stroke="#46546a" stroke-width="1.5"/>
<text x="246" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#69788b" text-anchor="middle">18:07</text>
<line x1="372.0" y1="184" x2="372.0" y2="192" stroke="#46546a" stroke-width="1.5"/>
<text x="372" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#69788b" text-anchor="middle">18:08</text>
<line x1="498.0" y1="184" x2="498.0" y2="192" stroke="#46546a" stroke-width="1.5"/>
<text x="498" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#69788b" text-anchor="middle">18:09</text>
<line x1="624.0" y1="184" x2="624.0" y2="192" stroke="#46546a" stroke-width="1.5"/>
<text x="624" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#69788b" text-anchor="middle">18:10</text>
<line x1="750.0" y1="184" x2="750.0" y2="192" stroke="#46546a" stroke-width="1.5"/>
<text x="750" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#69788b" text-anchor="middle">18:11</text>
<line x1="876.0" y1="184" x2="876.0" y2="192" stroke="#46546a" stroke-width="1.5"/>
<text x="876" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#69788b" text-anchor="middle">18:12</text>
<text x="239.7" y="138" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#ff6b63" text-anchor="middle">18:07 lost</text>
<text x="617.7" y="138" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#3fb950" text-anchor="middle">18:10 back</text>
<text x="32" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="600" fill="#e6edf3">flint2</text>
<rect x="239.7" y="248" width="378" height="64" rx="12" fill="#1d1a10" stroke="#e3b341"/>
<text x="428.7" y="275" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#e3b341" text-anchor="middle">the incident waits in the queue</text>
<text x="428.7" y="297" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8" text-anchor="middle">kept on flash, survives a restart</text>
<line x1="428.7" y1="178" x2="428.7" y2="248" stroke="#e3b341" stroke-dasharray="3 4"/>
<line class="flow" x1="676.5" y1="226" x2="676.5" y2="330" stroke="#4493f8" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="688.5" y="286" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#4493f8">sent once the internet is back</text>
<rect x="152" y="336" width="776" height="76" rx="14" fill="#182533" stroke="#283341" filter="url(#soft)"/>
<text x="170" y="366" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e6edf3">home: internet was down from 18:07 to 18:10 (3 min), confirmed by 0 of 2.</text>
<text x="170" y="392" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e6edf3">Seen by flint2. Times are approximate.</text>
<text x="152" y="438" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">That build still counted confirmations on a router's own loss; that loss now carries no count.</text>
</svg>
