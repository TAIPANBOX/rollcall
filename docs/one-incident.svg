<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" role="img" aria-label="One incident, one message. flint2 and beryl1 record beryl2 silent; beryl2 records its return in a new boot with nothing announced; a late record of the same absence is absorbed. They become one incident, ID 10d06737, and one chat line: beryl2 rebooted unexpectedly at 20:52, back after 39 s, confirmed by 2 of 2.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b63"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
  <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69788b"/></marker>
  <marker id="ar-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
  <marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker>
  <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  <marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#283341"/></marker>
</defs>
<style>
  .flow{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect width="960" height="446" fill="url(#bg)"/><rect width="960" height="446" fill="url(#grid)" opacity="0.5"/><rect width="960" height="4" fill="url(#accent)"/>
<text x="32" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">One incident, one message</text>
<text x="32" y="74" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#69788b">Every record of one absence flows into one incident. The lab run of 2026-10-23.</text>
<rect x="32" y="104" width="280" height="56" rx="12" fill="#141a23" stroke="#2dd4bf" filter="url(#soft)"/>
<text x="50" y="127" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">flint2 records</text>
<text x="50" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#2dd4bf">beryl2 silent</text>
<path class="flow" d="M316 132.0 C362 132.0 312 188 356 188" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="32" y="176" width="280" height="56" rx="12" fill="#141a23" stroke="#2dd4bf" filter="url(#soft)"/>
<text x="50" y="199" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">beryl1 records</text>
<text x="50" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#2dd4bf">beryl2 silent</text>
<path class="flow" d="M316 204.0 C362 204.0 312 224 356 224" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="32" y="248" width="280" height="56" rx="12" fill="#141a23" stroke="#2dd4bf" filter="url(#soft)"/>
<text x="50" y="271" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">beryl2 records</text>
<text x="50" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#2dd4bf">back in a new boot</text>
<path class="flow" d="M316 276.0 C362 276.0 312 260 356 260" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="32" y="336" width="280" height="56" rx="12" fill="#11161e" stroke="#46546a" stroke-dasharray="5 4"/>
<text x="50" y="359" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">a late record</text>
<text x="50" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#69788b">same absence: told once</text>
<path d="M316 364.0 C362 364.0 312 308 356 308" fill="none" stroke="#69788b" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#ar-gray)"/>
<rect x="362" y="158" width="304" height="170" rx="12" fill="#141a23" stroke="#4493f8" filter="url(#soft)"/>
<text x="382" y="190" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">one incident</text>
<text x="378" y="224" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">ID</text>
<text x="462" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3">10d06737</text>
<text x="378" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">kind</text>
<text x="462" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3">rebooted unexpectedly</text>
<text x="378" y="276" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">length</text>
<text x="462" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3">39 s</text>
<text x="378" y="302" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">confirmed</text>
<text x="462" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#e6edf3">2 of 2</text>
<text x="514" y="354" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b" text-anchor="middle">10 s window, one ID on every router</text>
<line class="flow" x1="672" y1="243" x2="694" y2="243" stroke="#4493f8" stroke-width="2" marker-end="url(#ar-blue)"/>
<rect x="700" y="154" width="228" height="168" rx="16" fill="#182533" stroke="#283341" filter="url(#soft)"/>
<text x="716" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e6edf3">home: beryl2 rebooted</text>
<text x="716" y="216" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e6edf3">unexpectedly at 20:52,</text>
<text x="716" y="244" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e6edf3">back after 39 s,</text>
<text x="716" y="272" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e6edf3">confirmed by 2 of 2.</text>
<text x="716" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#79b0ff">[10d06737]</text>
<text x="814" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#4493f8" text-anchor="middle">one line in the chat</text>
<text x="32" y="426" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">Two silences, a return and a late record: one line in the chat, with one ID.</text>
</svg>
