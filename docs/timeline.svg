<rect x="220" y="532" width="468" height="70" rx="14" fill="#182533" stroke="#283341"/>
<text x="238" y="561" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">home: beryl2 rebooted unexpectedly at 20:52,</text>
<text x="238" y="583" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">back after 39 s, confirmed by 2 of 2.</text>
