<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1066" viewBox="0 0 1280 1066" role="img" aria-label="The three test routers, a Flint 2 and two Beryl AX, each with the same measurements of rollcall 1.0.0-rc1: memory 12.6 to 15.5 MB, CPU 0.14 to 0.15 percent of one core, 8 to 11 threads, 65 to 80 KB of state, 74 system calls in the seccomp filter, every capability set empty; download 4.9 MB, installed 11 MiB">
