<svg xmlns="http://www.w3.org/2000/svg" width="960" height="612" viewBox="0 0 960 612" role="img" aria-label="Who sends. Every router runs the same rule: the sender role, internet, a Telegram call within 60 s, not silent; then the highest priority, then the lowest ID. When the sender goes silent the next one sends what is left after 15 s. An acknowledgement in the sender's signed history spreads with the heartbeats, so nobody sends twice.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b63"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
  <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69788b"/></marker>
  <marker id="ar-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
  <marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker>
  <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  <marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#283341"/></marker>
</defs>
<style>
  .flow{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect width="960" height="612" fill="url(#bg)"/><rect width="960" height="612" fill="url(#grid)" opacity="0.5"/><rect width="960" height="4" fill="url(#accent)"/>
<text x="32" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Who sends</text>
<text x="32" y="74" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#69788b">No server and no vote: the same rule, run on every router, gives the same answer.</text>
<rect x="32" y="100" width="288" height="172" rx="12" fill="#141a23" stroke="#4493f8" filter="url(#soft)"/>
<g transform="translate(48,114) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#4493f8" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#4493f8"/><circle cx="24" cy="26" r="3" fill="#4493f8" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="122" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="600" fill="#e6edf3">gateway</text>
<text x="54" y="204" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#3fb950" text-anchor="middle">✓</text>
<text x="70" y="204" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">sender role</text>
<text x="54" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#3fb950" text-anchor="middle">✓</text>
<text x="70" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">internet</text>
<text x="54" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#3fb950" text-anchor="middle">✓</text>
<text x="70" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">Telegram within 60 s</text>
<rect x="122" y="146" width="128" height="26" rx="13" fill="#0f1520" stroke="#4493f8"/>
<text x="186" y="164" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#4493f8" text-anchor="middle">sends</text>
<rect x="336" y="100" width="288" height="172" rx="12" fill="#141a23" stroke="#2dd4bf" filter="url(#soft)"/>
<g transform="translate(352,114) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#2dd4bf"/><circle cx="24" cy="26" r="3" fill="#2dd4bf" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="426" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="600" fill="#e6edf3">ap-office</text>
<text x="358" y="204" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#3fb950" text-anchor="middle">✓</text>
<text x="374" y="204" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">sender role</text>
<text x="358" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#3fb950" text-anchor="middle">✓</text>
<text x="374" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">internet</text>
<text x="358" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#3fb950" text-anchor="middle">✓</text>
<text x="374" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">Telegram within 60 s</text>
<rect x="426" y="146" width="128" height="26" rx="13" fill="#0f1520" stroke="#2dd4bf"/>
<text x="490" y="164" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2dd4bf" text-anchor="middle">next in line</text>
<rect x="640" y="100" width="288" height="172" rx="12" fill="#141a23" stroke="#69788b" filter="url(#soft)"/>
<g transform="translate(656,114) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#69788b" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#69788b"/><circle cx="24" cy="26" r="3" fill="#69788b" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="730" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="600" fill="#e6edf3">ap-kitchen</text>
<text x="662" y="204" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#ff6b63" text-anchor="middle">✗</text>
<text x="678" y="204" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">sender role</text>
<text x="662" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#3fb950" text-anchor="middle">✓</text>
<text x="678" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">internet</text>
<text x="662" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#69788b" text-anchor="middle">·</text>
<text x="678" y="252" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#69788b">never holds the token</text>
<rect x="730" y="146" width="128" height="26" rx="13" fill="#0f1520" stroke="#69788b"/>
<text x="794" y="164" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#69788b" text-anchor="middle">never sends</text>
<rect x="32" y="290" width="896" height="52" rx="12" fill="#10221f" stroke="#2dd4bf"/>
<text x="52" y="322" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">The rule: of the routers with all three ticks and not silent, the highest priority, then the lowest ID.</text>
<rect x="32" y="366" width="440" height="210" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="52" y="396" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">The sender goes silent</text>
<g transform="translate(56,420) scale(1)" opacity="0.35"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#4493f8" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#4493f8"/><circle cx="24" cy="26" r="3" fill="#4493f8" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="86" y="482" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#69788b" text-anchor="middle">gateway</text>
<path d="M70 428 l32 32 M102 428 l-32 32" stroke="#ff6b63" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(240,420) scale(1)"><rect x="12" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="44" y="0" width="4" height="16" rx="2" fill="#3a4658"/><rect x="0" y="14" width="60" height="24" rx="7" fill="#1f2834" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="14" cy="26" r="3" fill="#2dd4bf"/><circle cx="24" cy="26" r="3" fill="#2dd4bf" opacity="0.6"/><rect x="36" y="22" width="16" height="8" rx="2" fill="#0c1118" stroke="#46546a"/></g>
<text x="270" y="482" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#2dd4bf" text-anchor="middle">ap-office</text>
<line x1="126" y1="446" x2="232" y2="446" stroke="#69788b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar-gray)"/>
<text x="179" y="436" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b" text-anchor="middle">takes over</text>
<rect x="364" y="428" width="84" height="40" rx="10" fill="#182533" stroke="#283341"/>
<text x="406" y="453" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3" text-anchor="middle">chat</text>
<line class="flow" x1="306" y1="446" x2="358" y2="446" stroke="#4493f8" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="52" y="518" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">It sends what is left unacknowledged,</text>
<text x="52" y="542" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">once each incident has waited 15 s.</text>
<rect x="488" y="366" width="440" height="210" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="508" y="396" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Acknowledgements spread</text>
<circle cx="518" cy="428" r="12.5" fill="#4493f8"/>
<text x="518" y="432.5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0d1117" text-anchor="middle">1</text>
<text x="538" y="433" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">sent</text>
<line x1="518" y1="441" x2="518" y2="447" stroke="#46546a" stroke-width="2"/>
<circle cx="518" cy="460" r="12.5" fill="#a371f7"/>
<text x="518" y="464.5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0d1117" text-anchor="middle">2</text>
<text x="538" y="465" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">delivered: signed in its history</text>
<line x1="518" y1="473" x2="518" y2="479" stroke="#46546a" stroke-width="2"/>
<circle cx="518" cy="492" r="12.5" fill="#2dd4bf"/>
<text x="518" y="496.5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0d1117" text-anchor="middle">3</text>
<text x="538" y="497" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">spreads with the heartbeats</text>
<line x1="518" y1="505" x2="518" y2="511" stroke="#46546a" stroke-width="2"/>
<circle cx="518" cy="524" r="12.5" fill="#3fb950"/>
<text x="518" y="528.5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0d1117" text-anchor="middle">4</text>
<text x="538" y="529" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">every router drops it from its queue</text>
<text x="508" y="558" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#2dd4bf">So nobody sends it twice.</text>
</svg>
