<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Asking before accusing. Left: a router stops answering; after 15 s the observer asks two helpers whether they still hear it; only when none does is it recorded silent at 30 s. Right: a router that lost its own link sees every other router go silent, but the others heard each other all along and record its absence instead.">
<defs>
