<line x1="592" y1="262" x2="626" y2="262" stroke="#ff6b63" stroke-width="2"/><line x1="652" y1="262" x2="694" y2="262" stroke="#ff6b63" stroke-width="2" stroke-dasharray="3 4"/><path d="M632 255 l14 14 M646 255 l-14 14" stroke="#ff6b63" stroke-width="2.5" stroke-linecap="round"/>
<text x="866" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">they hear</text>
<text x="866" y="316" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">each other</text>
<text x="526" y="352" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e3b341">its view: everyone silent</text>
<text x="526" y="374" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#e3b341">set aside, not sent</text>
