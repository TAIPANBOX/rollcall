<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="Two reboots on 2026-10-23 as a time line. 20:52:24 beryl2 is forced to reboot with no clean shutdown; flint2 and beryl1 record its absence after 30 s without a heartbeat; 20:53:03 beryl2 is back after 39 s; the chat line arrives at 20:53, confirmed by 2 of 2. 20:53:57 flint2, the only sender, reboots cleanly and announces it; back after 45 s; its line arrives at 20:55.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  
</defs>
<style>
  /* a playhead sweeps the four minutes in 12 s */
  .head{animation:head 12s linear infinite}
  @keyframes head{0%{transform:translateX(0);opacity:0}3%{opacity:.5}95%{opacity:.5}100%{transform:translateX(960px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.head{animation:none;opacity:0}}
</style>
<rect width="1280" height="700" fill="url(#bg)"/><rect width="1280" height="700" fill="url(#grid)" opacity="0.5"/><rect width="1280" height="4" fill="url(#accent)"/>
<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Two reboots, as the routers saw them</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">2026-10-23, rollcall 1.0.0-rc1, three routers on one LAN. Router clocks; the chat shows minutes.</text>
<rect x="48" y="108" width="1184" height="400" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
