<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="How rollcall 1.0.0-rc1 was proven, left to right: 872 tests, the simulator with 1000 seeds and no failure, 19 gates that must fail on a planted fault, mutation testing, reproducible and attested builds, a lab run on three routers that found four defects, and the release candidate from the signed feed.">
